[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsec"
version = "0.1.0"
description = "Evidence-first LLM security assessment CLI for authorized security testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "llmsec maintainers" }
]
keywords = [
    "llm",
    "security",
    "red-teaming",
    "owasp",
    "canary",
    "penetration-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.urls]
Homepage = "https://github.com/sneha4leftclovers/llmsec"
Repository = "https://github.com/sneha4leftclovers/llmsec"
Issues = "https://github.com/sneha4leftclovers/llmsec/issues"

[project.scripts]
llmsec = "llmsec.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmsec" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
